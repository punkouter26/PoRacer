# Quadruped, alone, across every track in 90 minutes.
#
# WHY QUADRUPED. Of the three ML-Agents racers it is the one with a gradient left
# to climb. Measured 2026-09-10: Quad travels 8.0 m of a ~20 m track, against
# Hexapod's 6.8 and Crab's 2.4, and -- the part that matters -- its uprightDot sits
# at 0.574, meaning it is still choosing to tilt and move. Crab's was 1.000: fully
# collapsed into standing perfectly still, with nothing left to push against. Four
# legs are also the easiest body plan to get a gait from. If a corrected reward
# cannot move Quadruped in 90 minutes, it will not move the others either, so this
# is the cheapest honest test of the fix.
#
# THE CURRICULUM IS TIME-BASED HERE, ON PURPOSE, AND THAT IS A REVERSAL.
# Config/CrabAllTracks01.yaml gates on `measure: reward` and the reasoning behind it
# still holds: ramping difficulty ahead of competence is what put the fleet on full
# rough amplitude while its reward was still negative. But a skill gate and "all
# tracks in 90 minutes" cannot both be satisfied -- a creature that cannot yet walk
# never clears lesson 0, so it would spend the whole 90 minutes on flat ground and
# never see lumpy or swamp at all. Coverage is what was asked for, so the stopwatch
# is the right tool for THIS run.
#
# What makes the exposure worth having is the other half of the fix: as of
# 2026-09-10 Reward_WormLoco charges for being off-vertical instead of paying for
# being upright. Before that change, standing perfectly still netted +0.00204/step
# and progress had to exceed 0.426 m/s to compete with the uprightness it cost --
# so every creature learned to stand, and curriculum exposure taught stillness on
# progressively harder ground. Now standing still is strictly negative and forward
# progress is the only way to earn. Exposure teaches locomotion.
#
# If you want mastery of flat rather than coverage of everything, use
# CrabAllTracks01's reward gates and expect to stay on lesson 0.
#
# BUDGET. ~380 steps/s on 4 envs x 5400 s = ~2.05M steps, so max_steps 2,000,000
# makes the progress fractions below land on real wall-clock: each three-lesson
# parameter advances at 1/3 and 2/3, giving every track kind and hazard level
# roughly 30 minutes. The launcher's time box is the hard stop either way.
behaviors:
  Quad:
    trainer_type: ppo
    threaded: true
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.05
        demo_path: training/demos/Quad.demo
    behavioral_cloning:
      demo_path: training/demos/Quad.demo
      strength: 0.3
      steps: 400000
    max_steps: 2000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 10
    # 50k as a canary: the first export is also the first time the ONNX path runs,
    # so a broken exporter is otherwise found only after the budget is spent.
    # Verified on the Crab run -- first export landed at 49,950 steps.
    checkpoint_interval: 50000
environment_parameters:
  goal_distance_max:
    curriculum:
    - name: near
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.33
        min_lesson_length: 100
      value: 8.0
    - name: mid
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.66
        min_lesson_length: 100
      value: 14.0
    - name: far
      value: 20.0
  goal_angle_span:
    curriculum:
    - name: straight
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.33
        min_lesson_length: 100
      value: 0.0
    - name: gentle_turns
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.66
        min_lesson_length: 100
      value: 20.0
    - name: sharp_turns
      value: 40.0
  rough_amplitude:
    curriculum:
    - name: gentle
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.33
        min_lesson_length: 200
      value: 0.35
    - name: medium
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.66
        min_lesson_length: 200
      value: 0.7
    - name: full
      value: 1.0
  # "All the tracks": flat -> lumpy -> swamp, ~30 minutes each, which with
  # hazard_level below covers every builder map the game ships (Flat, Lumpy, Swamp,
  # Gale's hazards, Roulette's mix). The authored courses are a SEPARATE env --
  # Config/AcrobatLoco01.yaml and SCN_TRAIN_ACROBAT -- and are not in this run.
  track_kind:
    curriculum:
    - name: flat
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.33
        min_lesson_length: 200
      value: 0.0
    - name: lumpy
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.66
        min_lesson_length: 200
      value: 6.0
    - name: swamp
      value: 7.0
  hazard_level:
    curriculum:
    - name: clean
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.33
        min_lesson_length: 200
      value: 0.0
    - name: mud_and_boost
      completion_criteria:
        measure: progress
        behavior: Quad
        threshold: 0.66
        min_lesson_length: 200
      value: 1.0
    - name: full_hazards
      value: 2.0
  # Quirks are held at zero for the whole run, as plain constants rather than
  # curricula. They are race-day variation (per-racer power, mass and friction
  # jitter), not a track and not a skill, and widening them while a policy is still
  # learning to walk only adds noise to the gradient. Re-enable them in a follow-up
  # run once there is a gait to make robust.
  quirk_power_span: 0.0
  quirk_mass_span: 0.0
  quirk_friction_span: 0.0

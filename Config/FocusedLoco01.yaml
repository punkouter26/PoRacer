# Generated from AllLoco8h02. Worm and Spider removed 2026-09-04.
behaviors:
  Centipede:
    trainer_type: ppo
    threaded: true
    hyperparameters: &id001
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings: &id002
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic: &id003
        gamma: 0.995
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.05
        demo_path: training/demos/Centipede.demo
    behavioral_cloning:
      demo_path: training/demos/Centipede.demo
      strength: 0.3
      steps: 400000
    max_steps: 4500000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 10
    checkpoint_interval: 200000
  Crab:
    trainer_type: ppo
    threaded: true
    hyperparameters: *id001
    network_settings: *id002
    reward_signals:
      extrinsic: *id003
      gail:
        gamma: 0.99
        strength: 0.05
        demo_path: training/demos/Crab.demo
    behavioral_cloning:
      demo_path: training/demos/Crab.demo
      strength: 0.3
      steps: 400000
    max_steps: 4500000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 10
    checkpoint_interval: 200000
environment_parameters:
  goal_distance_max:
    curriculum:
    - name: near
      completion_criteria:
        measure: progress
        behavior: Crab
        threshold: 0.1
        min_lesson_length: 100
      value: 8.0
    - name: mid

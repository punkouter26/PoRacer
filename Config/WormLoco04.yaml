# Run-id: worm_loco04
# Experiment: PPO with a wider network (512x3 vs the fleet's 256x2), Worm only.
# Paired against worm_sac01; judge by ELO gauntlet, not mean reward.
behaviors:
  Worm:
    trainer_type: ppo
    threaded: true
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 5000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 500000

environment_parameters:
  goal_distance_max:
    curriculum:
      - name: near
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 12.0
          min_lesson_length: 100
        value: 8.0
      - name: far
        value: 20.0

# Run-id: worm_sac01
# Experiment: SAC (off-policy) on the Worm only, paired against worm_loco04
# (PPO, 512-wide). Judge the winner by ELO gauntlet (project rule), never by
# mean reward: import both runs' checkpoints and race them via
# "PoRacer/Training/Gauntlet - Add Selected Brains".
behaviors:
  Worm:
    trainer_type: sac
    threaded: true
    hyperparameters:
      batch_size: 256
      buffer_size: 500000
      buffer_init_steps: 5000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 2
      init_entcoef: 0.5
      reward_signal_steps_per_update: 2
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 5000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 500000

environment_parameters:
  goal_distance_max:
    curriculum:
      - name: near
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 12.0
          min_lesson_length: 100
        value: 8.0
      - name: far
        value: 20.0

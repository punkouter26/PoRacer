# Run-id: broken_loco01 (launch: .\scripts	rain_broken_1h.ps1)
# One-hour attended fine-tune of the creatures that do not reach the finish on
# the 20 m Flat race. Worm and Spider were removed from the app on 2026-09-04
# and are gone from here too.
# NOTE the init_path values point at results/all8h_20260826_2244, which is not in
# this tree - this config cannot run until those checkpoints exist again.
behaviors:
  Centipede:
    trainer_type: ppo
    threaded: true
    init_path: results/all8h_20260826_2244/Centipede/checkpoint.pt
    hyperparameters: &id001
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings: &id002
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals: &id003
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 300000
    time_horizon: 1000
    summary_freq: 10000
    keep_checkpoints: 8
    checkpoint_interval: 40000
  Crab:
    trainer_type: ppo
    threaded: true
    init_path: results/all8h_20260826_2244/Crab/checkpoint.pt
    hyperparameters: *id001
    network_settings: *id002
    reward_signals: *id003
    max_steps: 300000
    time_horizon: 1000
    summary_freq: 10000
    keep_checkpoints: 8
    checkpoint_interval: 40000
  Quad:
    trainer_type: ppo
    threaded: true
    init_path: results/all8h_20260826_2244/Quad/checkpoint.pt
    hyperparameters: *id001
    network_settings: *id002
    reward_signals: *id003
    max_steps: 300000
    time_horizon: 1000
    summary_freq: 10000
    keep_checkpoints: 8
    checkpoint_interval: 40000
  Hexapod:
    trainer_type: ppo
    threaded: true
    init_path: results/all8h_20260826_2244/Hexapod/checkpoint.pt
    hyperparameters: *id001
    network_settings: *id002
    reward_signals: *id003
    max_steps: 300000
    time_horizon: 1000
    summary_freq: 10000
    keep_checkpoints: 8
    checkpoint_interval: 40000
  Kangaroo:
    trainer_type: ppo
    threaded: true
    init_path: results/all8h_20260826_2244/Kangaroo/checkpoint.pt
    hyperparameters: *id001
    network_settings: *id002
    reward_signals: *id003
    max_steps: 300000
    time_horizon: 1000
    summary_freq: 10000
    keep_checkpoints: 8
    checkpoint_interval: 40000
  Blob:
    trainer_type: ppo
    threaded: true
    init_path: results/all8h_20260826_2244/Blob/checkpoint.pt
    hyperparameters: *id001
    network_settings: *id002
    reward_signals: *id003
    max_steps: 300000
    time_horizon: 1000
    summary_freq: 10000
    keep_checkpoints: 8
    checkpoint_interval: 40000
environment_parameters:
  goal_distance_max: 20.0
  goal_angle_span: 0.0
  rough_amplitude: 0.0
  track_kind: 0.0
  hazard_level: 0.0
  quirk_power_span: 0.08
  quirk_mass_span: 0.12
  quirk_friction_span: 0.15

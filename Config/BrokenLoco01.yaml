# Pinned to the Flat race: straight 20 m goal, flat clean ground, race-day
# quirk spread. No lessons, no clock.
environment_parameters:
  goal_distance_max: 20.0
  goal_angle_span: 0.0
  rough_amplitude: 0.0
  track_kind: 0.0
  hazard_level: 0.0
  quirk_power_span: 0.08
  quirk_mass_span: 0.12
  quirk_friction_span: 0.15

# Curriculum, paced by the Worm behavior like AllLoco02. Thresholds sit a bit
# lower than AllLoco02's 15/25 because the per-step time cost shaves a few
# points off every episode.
environment_parameters:
  goal_distance_max:
    curriculum:
      - name: near
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 12.0
          min_lesson_length: 100
        value: 8.0
      - name: mid
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 22.0
          min_lesson_length: 100
        value: 14.0
      - name: far
        value: 20.0
  rough_amplitude:
    curriculum:
      - name: gentle
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 12.0
          min_lesson_length: 100
        value: 0.35
      - name: medium
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 22.0
          min_lesson_length: 100
        value: 0.7
      - name: full
        value: 1.0
  # Map curriculum: learn to walk on flat ground, then dodge Lumpy's boulders,
  # then wade Swamp's mud and gates. Values are TrackKind enum ints.
  track_kind:
    curriculum:
      - name: flat
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 18.0
          min_lesson_length: 200
        value: 0.0
      - name: lumpy
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 24.0
          min_lesson_length: 200
        value: 6.0
      - name: swamp
        value: 7.0
  # Race-day power quirks: spawning scales joint power ~+/-8%; expose the
  # policy to the same spread once basic locomotion works.
  quirk_power_span:
    curriculum:
      - name: none
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 12.0
          min_lesson_length: 100
        value: 0.0
      - name: mild
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 22.0
          min_lesson_length: 100
        value: 0.05
      - name: race
        value: 0.08

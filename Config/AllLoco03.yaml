# Run-id: all_loco03
# Third-generation shared locomotion run. New versus AllLoco02:
#   - BC + GAIL warm start from coded-gait demos (record via
#     "PoRacer/Training/Enable Demo Recorders In Open Scene", play a few minutes
#     in SCN_TRAIN_ALL, exit; .demo files appear in Assets/Demonstrations/).
#   - Reward now includes a per-step time cost (Reward_WormLoco.TIME_PENALTY),
#     so completion thresholds sit lower than AllLoco02's.
#   - Curriculum adds track_kind (Flat 0 -> Lumpy 6 -> Swamp 7) and
#     quirk_power_span (race-day joint power randomization, up to +/-8%).
behaviors:
  Worm:
    trainer_type: ppo
    threaded: true
    hyperparameters: &hp
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings: &net
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic: &ext
        gamma: 0.995
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.05
        demo_path: Assets/Demonstrations/Worm.demo
    behavioral_cloning:
      demo_path: Assets/Demonstrations/Worm.demo
      strength: 0.3
      steps: 500000
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 500000
  Spider:
    trainer_type: ppo
    threaded: true
    hyperparameters: *hp
    network_settings: *net
    reward_signals:
      extrinsic: *ext
      gail: { gamma: 0.99, strength: 0.05, demo_path: Assets/Demonstrations/Spider.demo }
    behavioral_cloning: { demo_path: Assets/Demonstrations/Spider.demo, strength: 0.3, steps: 500000 }
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 500000
  Hexapod:

# Run-id: humanoids_<timestamp> (launch: .\scripts\train_humanoids.ps1)
# First training run for the four .glb bipeds (Grandma, Grandpa, Matt, Nick),
# split off from the nine coded-gait creatures because they share nothing with
# them: separate behaviors, separate areas, and a far harder problem.
#
# Deliberate differences from AllLoco8h01.yaml:
#   - NO BC/GAIL. A biped's coded gait is a fall, so cloning it would only teach
#     these four to face-plant faster. They learn to balance from extrinsic
#     reward alone.
#   - Wider network (512x3, the shape ML-Agents' own Walker sample uses). Eleven
#     joints of balance is a much larger control problem than a worm's five.
#   - NO CURRICULUM. Flat ground, goals dead ahead, no hazards, no quirks. The
#     whole task here is "stay upright and move"; hazards can wait until they can
#     do that at all. The curriculum in AllLoco8h01 also gates on `behavior: Worm`,
#     which does not exist in this run.
#   - max_steps is set far past what any one session will reach. Bipedal
#     locomotion is quoted in the tens of millions of steps; the launch script's
#     time box is the real stop, and -ResumeRunId continues toward it.
behaviors:
  Grandma: &biped
    trainer_type: ppo
    threaded: true
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 30000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 100000
  Grandpa: *biped
  Matt: *biped
  Nick: *biped

# Fixed at the easiest setting the training areas support: flat ground, the goal
# straight ahead, no mud/boost/gusts/gates, no per-racer power or mass spread.
environment_parameters:
  track_kind: 0        # TrackKind.Flat
  rough_amplitude: 0.0
  goal_distance_max: 12.0
  goal_angle_span: 0.0
  hazard_level: 0.0
  quirk_power_span: 0.0
  quirk_mass_span: 0.0
  quirk_friction_span: 0.0

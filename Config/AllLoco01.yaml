behaviors:
  Worm: &loco
    trainer_type: ppo
    threaded: true
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 500000
  Spider: *loco
  Hexapod: *loco
  Quad: *loco
  Snake: *loco
  Centipede: *loco
  Crab: *loco
  Kangaroo: *loco
  Blob: *loco

# Curriculum: tasks start easy and harden as the pacing behavior (Worm) improves.
# goal_distance_max grows the trek; rough_amplitude raises the terrain bumps.
environment_parameters:
  goal_distance_max:
    curriculum:
      - name: near
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 15.0
          min_lesson_length: 100
        value: 8.0
      - name: mid
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 25.0
          min_lesson_length: 100
        value: 14.0
      - name: far
        value: 20.0
  rough_amplitude:
    curriculum:
      - name: gentle
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 15.0
          min_lesson_length: 100
        value: 0.35
      - name: medium
        completion_criteria:
          measure: reward
          behavior: Worm
          threshold: 25.0
          min_lesson_length: 100
        value: 0.7
      - name: full
        value: 1.0

  # --- The four .glb bipeds -------------------------------------------------
  # Present in Builds/AllEnv, so they must be configured here or mlagents aborts
  # at startup with "behavior name Grandma has not been specified". Settings are
  # lifted from Config/Humanoids01.yaml and differ from the nine coded-gait
  # creatures on purpose:
  #   - NO BC/GAIL: a biped's coded gait is a fall, so cloning it would only
  #     teach these four to face-plant faster. Extrinsic reward only.
  #   - Wider network (512x3, the shape ML-Agents' own Walker sample uses):
  #     eleven joints of balance is a far larger control problem than a worm's.
  #   - max_steps far past what one session reaches; the launcher's time box is
  #     the real stop. They therefore ignore the progress curriculum below,
  #     which keys off Worm's step count.
  Grandma: &biped
    trainer_type: ppo
    threaded: true
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 30000000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 100000
  Grandpa: *biped
  Matt: *biped
  Nick: *biped

# All lessons gate on progress (behavior step count / max_steps) so the schedule
# is a shared clock, fair to every creature. Order of arrival:
#   10%: goals get longer, terrain roughens, power/mass/friction quirks begin
#   15%: goals swing off-center (steering), map moves flat -> lumpy
#   20%: mud pits + boost pads appear
#   30-45%: everything at race-day full strength, gusts + gates last
environment_parameters:
  goal_distance_max:
    curriculum:
      - name: near
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.10, min_lesson_length: 100 }
        value: 8.0
      - name: mid
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.30, min_lesson_length: 100 }
        value: 14.0
      - name: far
        value: 20.0
  goal_angle_span:
    curriculum:
      - name: straight
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.15, min_lesson_length: 100 }
        value: 0.0
      - name: gentle_turns
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.35, min_lesson_length: 100 }
        value: 20.0
      - name: sharp_turns
        value: 40.0
  rough_amplitude:
    curriculum:
      - name: gentle
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.10, min_lesson_length: 100 }
        value: 0.35
      - name: medium
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.30, min_lesson_length: 100 }
        value: 0.7
      - name: full
        value: 1.0
  track_kind:
    curriculum:
      - name: flat
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.15, min_lesson_length: 200 }
        value: 0.0
      - name: lumpy
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.40, min_lesson_length: 200 }
        value: 6.0
      - name: swamp
        value: 7.0
  hazard_level:
    curriculum:
      - name: clean
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.20, min_lesson_length: 200 }
        value: 0.0
      - name: mud_and_boost
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.45, min_lesson_length: 200 }
        value: 1.0
      - name: full_hazards
        value: 2.0
  quirk_power_span:
    curriculum:
      - name: none
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.10, min_lesson_length: 100 }
        value: 0.0
      - name: mild
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.30, min_lesson_length: 100 }
        value: 0.05
      - name: race
        value: 0.08
  quirk_mass_span:
    curriculum:
      - name: none
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.10, min_lesson_length: 100 }
        value: 0.0
      - name: mild
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.30, min_lesson_length: 100 }
        value: 0.06
      - name: race
        value: 0.12
  quirk_friction_span:
    curriculum:
      - name: none
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.10, min_lesson_length: 100 }
        value: 0.0
      - name: mild
        completion_criteria: { measure: progress, behavior: Worm, threshold: 0.30, min_lesson_length: 100 }
        value: 0.15
      - name: slippery_or_grippy
        value: 0.3

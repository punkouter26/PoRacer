# Run-id: all8h_<timestamp> (launch: .\scripts	rain_all_8h.ps1 -ConfigPath Config\AllLoco8h02.yaml)
# AllLoco8h01 plus the four .glb bipeds. Builds/AllEnv contains all THIRTEEN
# behaviors, so a config listing only the nine coded-gait creatures aborts the
# run at startup - which is exactly what happened to all8h_20260826_2233.
# Run-id: all8h_<timestamp> (launch: .\scripts\train_all_8h.ps1)
# Fourth-generation unattended 8-hour all-creatures run (3.2M steps at ~400k steps/behavior/hour). New versus AllLoco5h01:
#   - OBSERVATION CHANGE: agents now see per-limb ground contact, root angular
#     velocity, stamina, and terrain probes (N*3 + 19). Run
#     "PoRacer/Sync Agent Observation Sizes", rebuild Builds/AllEnv, and
#     RE-RECORD DEMOS before this run — old .demo files carry the old obs size
#     and mlagents will reject them.
#   - BC + GAIL warm start from coded-gait demos (record via
#     "PoRacer/Training/Enable Demo Recorders In Open Scene" in SCN_TRAIN_ALL).
#   - Reward adds a jerk penalty (smooth gaits); fatigue drains joint power
#     under sustained high torque, in training and races alike.
#   - Curriculum gates on PROGRESS (fraction of max_steps), not on the Worm's
#     reward: every behavior steps at the same rate, so lessons advance on a
#     shared clock and slow learners are no longer dragged by the Worm's score.
#     (completion_criteria still requires a behavior name; Worm is just the clock.)
#   - New curriculum knobs: goal_angle_span (steering), hazard_level (mud/boost,
#     then gusts/gates), quirk_mass_span and quirk_friction_span (race-day
#     physics spread).
behaviors:
  Worm:
    trainer_type: ppo
    threaded: true
    hyperparameters: &hp
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings: &net
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic: &ext
        gamma: 0.995
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.05
        demo_path: Assets/Demonstrations/Worm.demo
    behavioral_cloning:
      demo_path: Assets/Demonstrations/Worm.demo
      strength: 0.3
      steps: 400000
    max_steps: &steps 3200000
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 250000
  Spider:
    trainer_type: ppo
    threaded: true
    hyperparameters: *hp
    network_settings: *net
    reward_signals:
      extrinsic: *ext
      gail: { gamma: 0.99, strength: 0.05, demo_path: Assets/Demonstrations/Spider.demo }
    behavioral_cloning: { demo_path: Assets/Demonstrations/Spider.demo, strength: 0.3, steps: 400000 }
    max_steps: *steps
    time_horizon: 1000
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 250000

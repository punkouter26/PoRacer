# ==============================================================================
# CreatureSac01.yaml
# SAC locomotion configuration for the multi-limbed creatures.
# The four .glb bipeds (Grandma, Grandpa, Matt, Nick) were retired 2026-09-11:
# no brain on disk, absent from CreatureCatalog, and their training scene and
# prefabs are gone. Crab defines the &creature_sac anchor Hexapod reuses.
# ==============================================================================

behaviors:
  Crab: &creature_sac
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.0003
      learning_rate_schedule: constant
      batch_size: 256
      buffer_size: 500000
      buffer_init_steps: 10000
      tau: 0.005
      steps_per_update: 1
      save_replay_buffer: false
      init_entcoef: 0.5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 500
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 100000

  Hexapod: *creature_sac

# ==============================================================================
# Multi-Stage Curriculum Learning & Domain Randomization
# ==============================================================================
environment_parameters:
  curriculum_stage:
    curriculum:
      - name: Stage1_FlatGround
        completion_criteria:
          measure: progress
          behavior: Grandma
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.25
        parameters:
          track_kind: 0        # Flat
          rough_amplitude: 0.0
          goal_distance_max: 8.0
          goal_angle_span: 0.0
          hazard_level: 0.0
          quirk_friction_span: 0.0

      - name: Stage2_SlopeAndRough
        completion_criteria:
          measure: progress
          behavior: Grandma
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.50
        parameters:
          track_kind: 1        # Lumpy
          rough_amplitude: 0.15
          goal_distance_max: 14.0
          goal_angle_span: 15.0
          hazard_level: 0.0
          quirk_friction_span: 0.2

      - name: Stage3_DomainRandomization
        completion_criteria:
          measure: progress
          behavior: Grandma
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.75
        parameters:
          track_kind: 1        # Lumpy
          rough_amplitude: 0.35
          goal_distance_max: 20.0
          goal_angle_span: 30.0
          hazard_level: 0.3
          quirk_power_span: 0.15
          quirk_mass_span: 0.15
          quirk_friction_span: 0.4

      - name: Stage4_FullCourseHazards
        parameters:
          track_kind: 2        # Swamp & Full Hazards
          rough_amplitude: 0.5
          goal_distance_max: 30.0
          goal_angle_span: 45.0
          hazard_level: 1.0
          quirk_power_span: 0.25
          quirk_mass_span: 0.25
          quirk_friction_span: 0.5

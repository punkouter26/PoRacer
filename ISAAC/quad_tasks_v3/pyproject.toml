[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quad_tasks_v3"
version = "0.1.0"
description = "Isaac Lab 3 (Newton / MuJoCo-Warp) task for the quad pilot (training/quad/QUAD_SPEC.md)"
requires-python = ">=3.12"
# isaaclab, isaaclab_newton, isaaclab_tasks, isaaclab_rl, rsl-rl-lib come from the Isaac Lab 3 checkout
# (ISAAC/isaaclab3) this package is installed INTO, and worm_tasks_v3 (ISAAC/worm_tasks_v3) supplies the
# shared per-world randomisers and torso-frame terms. Deliberately not listed so pip never resolves them.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["quad_tasks_v3*"]
